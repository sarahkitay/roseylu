# Guardrail keyword/semantic seed lexicon.
#
# THIS FILE IS THE PART OF THE SYSTEM THAT NEEDS THE MOST ONGOING CARE.
# Kids' slang shifts faster than any static list — this needs a named owner
# and a review cadence (see docs/BLOCKERS.md re: human review queue staffing),
# not a one-time write. Treat every list here as a starting point, not
# coverage.
#
# `keywords`   -> matched by keyword_filter.py (substring/regex, layer 1)
# `slang`      -> same matcher, split out so it's obvious which entries need
#                 the fastest refresh cycle
# `canonical`  -> reference phrases used by embedding_classifier.py (layer 2)
#                 for semantic similarity, not literal matching
#
# NOT clinically reviewed. See docs/BLOCKERS.md.

self_harm:
  keywords:
    - "kill myself"
    - "want to die"
    - "end my life"
    - "end it all"
    - "no reason to live"
    - "hurt myself"
    - "hurting myself"
    - "self harm"
    - "self-harm"
    - "cutting myself"
    - "cut myself"
    - "suicide"
    - "suicidal"
    - "better off dead"
    - "don't want to be alive"
  slang:
    - "kms"
    - "unalive myself"
    - "unalive"
    - "sewerslide"
    - "delete myself"
  canonical:
    - "I don't want to be alive anymore"
    - "I've been thinking about hurting myself"
    - "everyone would be better off without me"
    - "I want the pain to stop permanently"

